name: Bright Reads checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --check script.js && node --check account.js && node --check progress.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile preview.py
      - run: python preview.py --help
